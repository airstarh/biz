services:
  # PHP
  serv_va_stl_app:
    env_file: ./.env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cont_va_stl_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - netw_va_stl
    depends_on:
      - serv_va_stl_db
    environment:
      - DB_HOST=serv_va_stl_db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER}
    tmpfs:
      - /tmp

  # Nginx
  serv_va_stl_nginx:
    env_file: ./.env
    image: nginx:alpine
    container_name: cont_va_stl_nginx
    restart: unless-stopped
    ports:
      - "48080:8080"
    volumes:
      - ./:/var/www/html
      # Use a single file mount instead of a directory
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - netw_va_stl
    depends_on:
      - serv_va_stl_app

  # MySQL
  serv_va_stl_db:
    env_file: ./.env
    image: mysql:8.0
    container_name: cont_va_stl_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
    volumes:
      - volu_va_stl_db:/var/lib/mysql
    networks:
      - netw_va_stl
    ports:
      - "43306:3306"

  # Redis
  serv_va_stl_redis:
    env_file: ./.env
    image: redis:alpine
    container_name: cont_va_stl_redis
    restart: unless-stopped
    networks:
      - netw_va_stl
    ports:
      - "46379:6379"

# Networks
networks:
  netw_va_stl:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"

# Volumes
volumes:
  volu_va_stl_db:
    driver: local
